version: "3.8"
services:
  frontend:
    build: ./frontend
    ports: 
      - "80:80"
  backend:
    build: ./backend
    ports: 
      - "5000:5000"
  db:
      image: postgres:15
      container_name: postgres_db
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: mydb
      ports:
        - "5432:5432"
      volumes:
        - db_data:/var/lib/postgresql/data
      restart: always

volumes:
  db_data: