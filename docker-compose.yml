version: '3.8'

services:
  frontend:
    build: ./frontend
    ports: 
      - "80:80"
    container_name: hospital_assistant_frontend
    restart: always
    depends_on:
      - backend

  # FastAPI Application
  backend:
    build: ./backend
    container_name: hospital_assistant_api
    restart: always
    ports:
      - "5000:5000"
    # Use environment files for configuration and secrets
    env_file:
      - .env
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    depends_on:
      db:
        condition: service_healthy
      # ollama:
      #   condition: service_started
      #   required: false

  # PostgreSQL Database 
  db:
    image: postgres:15-alpine
    container_name: hospital_assistant_db
    restart: always
    # Environment variables are pulled from .env file
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM Service
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: hospital_assistant_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #     - ./ollama-entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
  #   environment:
  #     OLLAMA_MODEL: ${OLLAMA_MODEL}
  #   entrypoint: ["/bin/bash", "/usr/local/bin/ollama-entrypoint.sh"]

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local